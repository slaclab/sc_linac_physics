<!-- Tune config state diagram for docs/explainers/auto_tune.md. Colours are
     the explainer palette's dark tokens, on its own dark background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img"
         aria-label="Tune config state diagram">
      <rect width="720" height="210" rx="8" fill="#14161a"/>
      <defs>
        <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="3"
                orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#9aa3b2"/>
        </marker>
      </defs>
      <g font-family="ui-monospace, monospace" font-size="13">
        <rect x="20" y="20" width="150" height="52" rx="6"
              fill="#1c1f25" stroke="#7fb069"/>
        <text x="95" y="42" fill="#e6e8ec" text-anchor="middle">RESONANCE</text>
        <text x="95" y="60" fill="#9aa3b2" text-anchor="middle">0</text>

        <rect x="285" y="20" width="150" height="52" rx="6"
              fill="#1c1f25" stroke="#e0a458"/>
        <text x="360" y="42" fill="#e6e8ec" text-anchor="middle">OTHER</text>
        <text x="360" y="60" fill="#9aa3b2" text-anchor="middle">3</text>

        <rect x="550" y="20" width="150" height="52" rx="6"
              fill="#1c1f25" stroke="#6ea8fe"/>
        <text x="625" y="42" fill="#e6e8ec" text-anchor="middle">COLD</text>
        <text x="625" y="60" fill="#9aa3b2" text-anchor="middle">1</text>

        <rect x="285" y="135" width="150" height="52" rx="6"
              fill="#1c1f25" stroke="#6ea8fe"/>
        <text x="360" y="157" fill="#e6e8ec" text-anchor="middle">PARKED</text>
        <text x="360" y="175" fill="#9aa3b2" text-anchor="middle">2</text>

        <line x1="170" y1="38" x2="278" y2="38" stroke="#9aa3b2"
              marker-end="url(#arw)"/>
        <text x="224" y="30" fill="#9aa3b2" text-anchor="middle"
              font-size="11">_auto_tune entry</text>

        <line x1="278" y1="58" x2="172" y2="58" stroke="#9aa3b2"
              marker-end="url(#arw)"/>
        <text x="224" y="76" fill="#9aa3b2" text-anchor="middle"
              font-size="11">move_to_resonance exit</text>

        <line x1="435" y1="46" x2="543" y2="46" stroke="#9aa3b2"
              marker-end="url(#arw)"/>
        <line x1="360" y1="72" x2="360" y2="128" stroke="#9aa3b2"
              marker-end="url(#arw)"/>
      </g>
    </svg>
