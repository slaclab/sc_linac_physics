name: Explainer preview comment

# Posts the comment rendered by explainer-preview.yml. Copied from
# pr-size-comment.yml; see that file for why this runs on `workflow_run` and
# why it never checks out or runs anything from the PR.
#
# NOTE: `workflow_run` only fires from the copy of this file on main, so it
# will not run on the PR that adds it.

on:
  workflow_run:
    workflows: ["Explainer preview"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download comment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: explainer-preview
          path: explainer-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: |
          set -euo pipefail
          # Digits only: it came from a fork-influenced run and goes to the API.
          NUM=$(tr -dc '0-9' < explainer-preview/pr-number | head -c 10)
          if [ -z "$NUM" ]; then
            echo "artifact contained no usable PR number" >&2
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        continue-on-error: true
        with:
          header: explainer-preview
          number: ${{ steps.pr.outputs.number }}
          path: explainer-preview/comment.md
