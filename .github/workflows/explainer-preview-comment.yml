name: Explainer preview comment

# Posts a sticky comment linking a live preview of each explainer page a PR
# adds, changes or renames, and removes the comment once there are none.
# GitHub serves repo HTML as source, so without this a reviewer has to check
# the PR out to see the page. A markdown explainer is linked to GitHub's own
# rendered view of the file at the PR's head commit, since GitHub opens
# markdown diffs as source and has no setting to change that.
#
# Runs on `workflow_run` so it has a writable token for fork PRs (see
# pr-size-comment.yml). Unlike that pair, it trusts nothing the triggering run
# produced: a fork can rewrite that run. Everything here comes from the
# `workflow_run` event and the GitHub API:
#
#   PR number  — the open PR whose head repo, branch and SHA match the run.
#   page list  — the PR's changed files from the API, filtered to
#                docs/explainers/<name>.html, docs/explainers/<name>.md, and
#                the widgets markdown explainers embed,
#                docs/explainers/widgets/<name>.html.
#
# The link goes through htmlpreview.github.io, a third-party renderer, reading
# raw.githubusercontent.com at refs/pull/N/head. That ref follows every push.
# raw.githubusercontent.com caches for a few minutes.
#
# NOTE: `workflow_run` only fires from the copy of this file on main, so it
# will not run on the PR that adds it.

on:
  workflow_run:
    workflows: ["Explainer preview"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find PR and render comment
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          OWNER="${HEAD_REPO%%/*}"
          # GitHub sets this, but it is spliced into the jq filter below, so
          # refuse anything that is not a commit SHA.
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "unexpected head SHA: $HEAD_SHA" >&2
            exit 1
          fi

          # The SHA match is what ties the PR to this run. A branch name alone
          # could match a PR whose head has since moved.
          NUM=$(gh api -X GET "repos/${REPO}/pulls" \
                  -f state=open -f head="${OWNER}:${HEAD_BRANCH}" \
                  --jq "map(select(.head.sha == \"${HEAD_SHA}\")) | .[0].number // empty")
          if [ -z "$NUM" ]; then
            echo "no open PR matches ${HEAD_REPO}@${HEAD_SHA}; nothing to do"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

          # Every status except removed. For a rename, .filename is the new
          # path. The name filter keeps a fork-chosen filename from carrying
          # markdown into the comment.
          FILES=$(gh api --paginate "repos/${REPO}/pulls/${NUM}/files" \
                    --jq '.[] | select(.status != "removed") | .filename')
          PAGES=$(grep -E '^docs/explainers/(widgets/)?[A-Za-z0-9_.-]+\.html$' <<< "$FILES" || true)
          DOCS=$(grep -E '^docs/explainers/[A-Za-z0-9_.-]+\.md$' <<< "$FILES" || true)

          if [ -z "$PAGES" ] && [ -z "$DOCS" ]; then
            echo "pages=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pages=some" >> "$GITHUB_OUTPUT"

          RAW="https://raw.githubusercontent.com/${REPO}/refs/pull/${NUM}/head"
          BLOB="https://github.com/${REPO}/blob/${HEAD_SHA}"
          {
            echo "### Explainer preview"
            echo
            if [ -n "$DOCS" ]; then
              while read -r doc; do
                echo "- [\`$(basename "$doc")\`](${BLOB}/${doc}), rendered by GitHub"
              done <<< "$DOCS"
            fi
            if [ -n "$PAGES" ]; then
              while read -r page; do
                echo "- [\`$(basename "$page")\`](https://htmlpreview.github.io/?${RAW}/${page})"
              done <<< "$PAGES"
            fi
            echo
            echo "<sub>Follows the latest push; allow a few minutes for caching."
            echo "\`.html\` pages are rendered by htmlpreview.github.io, a third-party service."
            echo "GitHub's view of a \`.md\` page shows \`!!!\` boxes as plain text and"
            echo "widgets as links.</sub>"
          } > comment.md

      - name: Comment
        if: steps.render.outputs.number != '' && steps.render.outputs.pages == 'some'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        continue-on-error: true
        with:
          header: explainer-preview
          number: ${{ steps.render.outputs.number }}
          path: comment.md

      # A revert or a removed page leaves nothing to preview. Clear the old
      # comment rather than leave a link that now 404s.
      - name: Remove comment
        if: steps.render.outputs.number != '' && steps.render.outputs.pages == 'none'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        continue-on-error: true
        with:
          header: explainer-preview
          number: ${{ steps.render.outputs.number }}
          delete: true
