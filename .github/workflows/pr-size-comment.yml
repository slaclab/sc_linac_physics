name: PR size comment

# Posts the report produced by pr-size.yml as a sticky comment.
#
# Why this is a separate workflow: a `pull_request` run from a fork gets a
# read-only GITHUB_TOKEN regardless of its `permissions:` block, so it cannot
# comment. A `workflow_run` run executes in the base repository's context with a
# writable token and fires for fork PRs too, which makes it the only way to get
# a comment onto the ~90% of PRs here that come from forks.
#
# That writable token is why this workflow deliberately does almost nothing. It
# never checks out the PR, never runs code from it, and reads exactly two small
# files out of the artifact:
#
#   pr-number   — validated to digits before use; it originates from a
#                 fork-controlled run and is passed to the GitHub API.
#   comment.md  — handed to the action as a file path, so untrusted text is
#                 never interpolated into a shell command or through a
#                 $GITHUB_OUTPUT heredoc.
#
# NOTE: `workflow_run` only triggers from the copy of this file on the default
# branch. It will not run on the PR that introduces it — expect the first
# comment on the next PR after this merges. Until then the size is on the
# "PR size" run summary.

on:
  workflow_run:
    workflows: ["PR size"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-size
          path: pr-size
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: |
          set -euo pipefail
          # Strip to digits: this value comes from a run that fork-authored
          # content influenced, and it is about to be used in an API call.
          NUM=$(tr -dc '0-9' < pr-size/pr-number | head -c 10)
          if [ -z "$NUM" ]; then
            echo "artifact contained no usable PR number" >&2
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        continue-on-error: true
        with:
          header: pr-size
          number: ${{ steps.pr.outputs.number }}
          path: pr-size/comment.md
