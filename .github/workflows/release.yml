name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-versions:
    uses: ./.github/workflows/_get-versions.yml
    with:
      production-python: ${{ vars.PRODUCTION_PYTHON || '3.12' }}

  test:
    needs: [get-versions]
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: ${{ needs.get-versions.outputs.required }}

  test-experimental:
    needs: [get-versions]
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: ${{ needs.get-versions.outputs.experimental }}
      continue-on-error: true

  package:
    uses: ./.github/workflows/_package.yml

  release:
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install -U pip
          pip install python-semantic-release build

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.SEMANTIC_RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git log --oneline -5
          semantic-release version

      - name: Build and publish
        if: steps.release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          python -m build
          semantic-release publish
          TAG=$(git describe --tags --abbrev=0)
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber

      # Collect the `## Operator-visible` sections from the PRs in this release
      # so operators hear about behavior changes instead of discovering them at
      # launch. Silent when nothing operator-visible shipped.
      - name: Collect operator-visible notes
        id: notes
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          python .github/scripts/operator_notes.py --tag "$TAG"

      # Requires a SLACK_RELEASE_WEBHOOK repo secret. Without it this step
      # prints the note to the job log and exits cleanly, so the workflow is
      # safe to merge before the webhook exists.
      # Quoted: an unquoted '#' starts a YAML comment, which would truncate
      # this step's name to "Post to" in the Actions UI.
      - name: "Post to #srf-software"
        if: >-
          steps.release.outputs.released == 'true' &&
          steps.notes.outputs.has_notes == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          NOTE: ${{ steps.notes.outputs.note }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          note = os.environ.get("NOTE", "").strip()

          if not note:
              print("no operator-visible notes; nothing to post")
              raise SystemExit(0)

          if not url:
              print("SLACK_RELEASE_WEBHOOK not set — would have posted:\n")
              print(note)
              raise SystemExit(0)

          req = urllib.request.Request(
              url,
              data=json.dumps({"text": note}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              print("slack responded", r.status)
          PY
        continue-on-error: true

      - name: No release needed
        if: steps.release.outputs.released == 'false'
        run: echo "No new release — no qualifying commits since ${{ steps.release.outputs.version }}"
